[project]
name = "gc-reel-map"
version = "0.1.0"
description = "Telegram bot that turns travel reels shared in a group chat into one shared trip map"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0",
    "filelock>=3.15",
    "tzdata>=2024.1",
    "google-genai>=1.0",
    "pydantic>=2.0",
    "reelkit[telegram]",
]

[project.scripts]
gcreelmap = "gcreelmap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "httpx>=0.27",
    "ruff>=0.7",
    "pyright>=1.1",
    "pip-audit>=2.7",
]

[tool.uv.sources]
reelkit = { git = "https://github.com/adriantimoteo/reel-notes", subdirectory = "packages/reelkit", rev = "dfcf461c95da9aa19c283d3b7465e28aae3a55f3" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcreelmap"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: hits real external services; needs RUN_LIVE=1",
    "perf: performance budget tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
